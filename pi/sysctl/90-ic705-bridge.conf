# Room for a second or more of the client's audio while wfserver is busy: on a
# Pi Zero W it stalls for over half a second while the radio transmits, and with
# the default (about 180 KB, some 60 audio packets) the kernel drops the rest,
# heard on air as missing syllables. wfserver does not size its own sockets.
net.core.rmem_default = 1048576
